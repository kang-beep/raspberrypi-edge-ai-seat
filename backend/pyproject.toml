[project]
name = "smartseat-backend"
version = "0.1.0"
description = "FastAPI backend for Raspberry Pi Edge AI smart seat system"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "paho-mqtt",
    "pydantic-settings",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.33",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv]
package = true
